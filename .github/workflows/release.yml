name: Release

# Tagging is the release. Publishing by hand is what let package.json reach
# 0.8.0 while npm still served 0.7.0 — and because the action resolves the npm
# package, that drift silently changed what every consumer actually ran.
on:
  push:
    tags: ['v*']

# Releases queue, never cancel. Interrupting a publish mid-flight is how you get
# a version that is half on the registry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # for the GitHub Release
  id-token: write   # for the Sigstore OIDC token that signs provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || {
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          }
          # The shipped example pins a literal version, which is the line that
          # has twice been left naming the previous release during a bump.
          bad=$(grep -ohE '(cleartoship@|cleartoship/releases/download/)v[0-9]+\.[0-9]+\.[0-9]+' \
                  examples/security.yml README.md \
                | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u | grep -vx "v${pkg}" || true)
          if [ -n "$bad" ]; then
            echo "::error::docs name $(echo $bad) but package.json declares v${pkg}"
            exit 1
          fi
          echo "releasing ${pkg}"

      - run: npm ci
      - run: npm run build
      - run: npm test
      # The fixtures under test/ are intentionally vulnerable; everything else
      # this publishes gets scanned, docs and manifests included.
      - run: >-
          node dist/cli.js
          src site examples scripts .github
          action.yml package.json README.md SECURITY.md ATTRIBUTION.md TODO.md
          --fail-on=critical

      # Ahead of the npm publish, deliberately. This step used to be last, so
      # when the token check failed the GitHub Release was skipped with it —
      # and the one distribution channel that does not depend on npm was left
      # hostage to npm succeeding. v0.13.5 tagged, failed at the token, and
      # left a bare tag with nothing anyone could download.
      #
      # Idempotent, because the whole point is that this tag gets re-run once
      # the token is fixed: `gh release create` on an existing release is an
      # error, so an existing one gets the asset re-uploaded instead.
      - name: Create the GitHub Release and attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two artifacts, and they are not the same thing.
          #
          # cleartoship-X.Y.Z.tgz is the npm package: the module tree, five
          # runtime dependencies, identical to what the registry serves.
          #
          # cleartoship-standalone.tgz is one bundled file with no dependencies
          # at all, so it installs when the registry cannot resolve anything.
          # Its name carries no version on purpose, which makes
          # /releases/latest/download/cleartoship-standalone.tgz a permanent
          # install URL and keeps a version literal out of the README — the one
          # line that has repeatedly been left naming the previous release.
          tarball=$(npm pack --silent)
          npm run bundle
          packed=$(cd standalone && npm pack --silent)
          mv "standalone/${packed}" cleartoship-standalone.tgz
          ls -la "${tarball}" cleartoship-standalone.tgz

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${tarball}" cleartoship-standalone.tgz --clobber
            echo "::notice::Updated release ${GITHUB_REF_NAME}."
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${tarball}" cleartoship-standalone.tgz \
              --generate-notes --title "${GITHUB_REF_NAME}"
            echo "::notice::Released ${GITHUB_REF_NAME}."
          fi
          echo "Installable with no registry at all:"
          echo "  npx https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/cleartoship-standalone.tgz"

      - name: Check the npm token before publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # npm answers an unauthorized publish with a 404 that reads like "the
          # package does not exist", which sends you hunting in entirely the wrong
          # place. Ask who we are first, so the failure names the real cause.
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is empty or not set on this repo."
            exit 1
          fi
          if ! who=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is not a valid npm token. npm whoami said: ${who}"
            echo "::error::Generate a Classic -> Automation token at npmjs.com and re-set the secret."
            exit 1
          fi
          echo "npm authenticated as: ${who}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is gated on this, not on a hand-edited flag, so it turns
          # itself on the day the repository goes public.
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          ver=$(node -p "require('./package.json').version")
          published() { [ "$(npm view "cleartoship@${ver}" version 2>/dev/null)" = "$ver" ]; }

          if published; then
            echo "cleartoship@${ver} is already published; nothing to do."
            exit 0
          fi

          # Provenance ties the tarball to this workflow run and this commit
          # through Sigstore. The npm CLI's own prerequisites are only an OIDC
          # token and a public *package* — but the registry adds one the CLI
          # does not, and 0.9.0 proved it the expensive way:
          #
          #   npm error 422 ... Error verifying sigstore provenance bundle:
          #   Unsupported GitHub Actions source repository visibility: "private".
          #   Only public source repositories are supported when publishing with
          #   provenance.
          #
          # Worse, the CLI signs and writes the attestation to the *public*
          # Sigstore transparency log before the registry rejects it, so an
          # optimistic attempt leaks this repo's name and commit SHA on every
          # release for nothing. Hence: ask first, attempt never.
          if [ "$REPO_IS_PRIVATE" = "false" ]; then
            echo "Repository is public — publishing with provenance."
            if npm publish --provenance --access public; then
              exit 0
            fi
            if published; then
              echo "::warning::publish exited non-zero yet the registry serves ${ver}; not retrying"
              exit 0
            fi
            echo "::warning::Publishing with provenance failed. Retrying without it so the release still ships — read the error above and fix it before the next release."
          else
            echo "::notice::Repository is private, so npm would reject a provenance-signed publish. Publishing unsigned; this becomes signed automatically once the repo is public."
          fi

          npm publish --access public

      - name: Verify the registry actually serves it
        run: |
          # A green publish step is not a published package. Poll until the
          # registry serves the new version rather than trusting the exit code.
          ver=$(node -p "require('./package.json').version")
          for i in $(seq 1 10); do
            if [ "$(npm view "cleartoship@${ver}" version 2>/dev/null)" = "$ver" ]; then
              echo "registry serves cleartoship@${ver}"
              exit 0
            fi
            echo "attempt ${i}: not visible yet, waiting..."
            sleep 6
          done
          echo "::error::cleartoship@${ver} never appeared on the registry"
          exit 1
