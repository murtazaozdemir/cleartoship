name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a pull request, where only the latest push matters.
# Never on main: each commit there needs its own verdict, and a run cancelled by
# the next push leaves a commit with no signal at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Everything except the fixtures under test/, which are deliberately
      # vulnerable. Listed explicitly rather than scanning `src` alone: the
      # README, the manifests, the shipped Action and the landing page are all
      # part of what this publishes, and a self-scan that read none of them let
      # a false positive on this project's own README survive a release.
      #
      # Online, on purpose, and without --allow-incomplete: the dependency
      # checks on this project's own package.json only run with the network,
      # and GitHub-hosted runners have it. The cost is that an npm or OSV
      # outage makes this step exit 3 (incomplete) instead of passing. Re-run
      # it; do not add --offline or --allow-incomplete to turn it green, since
      # a scan that did not finish is what this tool refuses to call clear.
      - run: >-
          node dist/cli.js
          src site examples scripts .github
          action.yml package.json README.md SECURITY.md ATTRIBUTION.md TODO.md CLAUDE.md
          --fail-on=critical

  # A version that appears in prose drifts; one that is asserted does not.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # One script, so ci.yml and release.yml cannot drift apart. It covers
      # README.md, examples/*.yml and the landing page (site/public/*.html).
      - name: Docs must pin the version this repo declares
        run: scripts/check-version-pins.sh

  # Rule 26 step 6. A separate job rather than a step in version-consistency:
  # that job's name is a status check and renaming it would quietly break any
  # branch protection that requires it.
  file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the git index, so a gitignored local file cannot fail the gate.
      - name: No new source file over 500 lines, and no allowlisted file grew
        run: scripts/check-file-sizes.sh

  # VG1070. `--ignore-scripts` on every `npm ci` above closes the install-script
  # path; this job checks the other half of the same question -- that what came
  # down the wire is what the publisher signed.
  #
  # Online and third-party on purpose: it reaches registry.npmjs.org and
  # Sigstore's TUF root (tuf-repo-cdn.sigstore.dev). A Sigstore outage therefore
  # fails this job, the same trade the self-scan already makes with npm and OSV.
  # Re-run it rather than deleting the step: a check that cannot verify is not a
  # check that passed. Measured 2026-11-12: 29 of 29 packages have verified
  # registry signatures and 16 carry attestations.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Every dependency must carry a verified registry signature
        run: npm audit signatures
