name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a pull request, where only the latest push matters.
# Never on main: each commit there needs its own verdict, and a run cancelled by
# the next push leaves a commit with no signal at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The fixtures under test/ are intentionally vulnerable, so scan src only.
      - run: node dist/cli.js src --fail-on=critical
