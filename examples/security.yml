# Copy to .github/workflows/security.yml in your own repository.
#
# NOTE: this file uses the composite action, which lives in the (currently
# private) cleartoship repository — `uses: murtazaozdemir/cleartoship@…` will
# fail with "Unable to resolve action" for anyone who cannot read that repo.
# Until it is public, use examples/security-cli.yml, which drives the published
# npm package and needs no access to anything.
name: ClearToShip

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # for the summary comment
  security-events: write # for the optional SARIF upload

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: murtazaozdemir/cleartoship@v0.10.1
        with:
          fail-on: critical   # block the PR only on criticals
          comment: true        # post a summary comment on the PR
          sarif: true          # also upload to the Security tab
