# SonarQube Cloud analysis settings.
#
# Added because the analysis was running unconfigured — no workflow, no
# properties file — and failing the quality gate on every pull request. A gate
# that always fails is a gate nobody reads, which is the same argument this
# project makes about its own false positives in TODO.md.
#
# Each exclusion below is a decision with a reason, not a way to make a number
# go green. Nothing that ships to a user is excluded.

sonar.projectKey=murtazaozdemir_cleartoship2
sonar.organization=murtazaozdemir

sonar.sources=src,scripts
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Build output. Regenerated from src by `npm run build` and `npm run bundle`,
# gitignored, and in the bundle's case a single 2 MB file of inlined
# dependencies — analysing it measures esbuild, not this project.
sonar.exclusions=dist/**,standalone/**,src/vendor/**

# src/vendor/ is the third-party rule data this tool runs: gitleaks' credential
# regexes and GuardVibe's rule tables, vendored with their licences under
# LICENSES/ and attributed in ATTRIBUTION.md. It is data in TypeScript clothing
# — several hundred detection patterns and the example payloads that go with
# them. Scanned as first-party source it reports noise proportional to the size
# of the ruleset rather than to anything anyone here wrote, and the upstream
# projects are where a real finding in it should go.

# Security rules are not run over test/. The fixtures there are credential-
# shaped on purpose: the suite cannot check that a real-looking AWS key is
# reported, and a run of X's is not, without containing both. This project's own
# scanner reports those same lines at `low` rather than critical, by a
# deliberate path rule — a fake key in a test is a fixture, not a leak. Applying
# the opposite judgement here would mean deleting the tests to satisfy a rating.
sonar.issue.ignore.multicriteria=fixtures
sonar.issue.ignore.multicriteria.fixtures.ruleKey=*
sonar.issue.ignore.multicriteria.fixtures.resourceKey=test/**
